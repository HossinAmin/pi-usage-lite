name: Version check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  require-version-bump:
    name: Require a package version bump
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Compare package version with base branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch origin "${BASE_BRANCH}" --depth=1
          git show "origin/${BASE_BRANCH}:package.json" > /tmp/base-package.json

          BASE_VERSION="$(bun -e 'const pkg = await Bun.file("/tmp/base-package.json").json(); console.log(pkg.version)')"
          PR_VERSION="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version)')"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

          if ! [[ "$PR_VERSION" =~ $SEMVER_RE ]]; then
            echo "package.json version '${PR_VERSION}' is not valid semver" >&2
            exit 1
          fi

          if [[ "$PR_VERSION" == "$BASE_VERSION" ]]; then
            echo "Bump package.json version before merging into ${BASE_BRANCH}." >&2
            echo "Current ${BASE_BRANCH} version: ${BASE_VERSION}" >&2
            echo "Pull request version:       ${PR_VERSION}" >&2
            echo "Example: bun pm pkg set version=0.1.2" >&2
            exit 1
          fi

          echo "Version changed: ${BASE_VERSION} -> ${PR_VERSION}"
